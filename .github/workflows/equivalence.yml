# Live equivalence check against the archived CRAN packages
# (SILM 1.0.0, hdi 0.1-10 / 0.1-6, scalreg 1.0.1): the archived code and the
# current code are run side by side and compared with identical().
name: equivalence

on:
  push:
    branches: [main]
    paths: ['R/**', 'DESCRIPTION', 'validation/**', '.github/workflows/equivalence.yml']
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      tier:
        description: 'Scenario tier (fast or full)'
        default: 'fast'

permissions:
  contents: read

concurrency:
  group: equivalence-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  equivalence:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    # The full tier is split into shards (regular expressions on scenario ids)
    # that run in parallel; the fast tier runs as one job.
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(((github.event.inputs.tier == 'full' || github.event_name == 'schedule') && '["^A|^E-|^V-", "^B-SR|^B-Step", "^B-SimCI-znz", "^B-SimCI-cv", "^B-ST-znz", "^B-ST-cv", "^C-", "^D-"]') || '["."]') }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      OPENBLAS_NUM_THREADS: 1
      TIER: ${{ github.event.inputs.tier || (github.event_name == 'schedule' && 'full') || 'fast' }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::callr, any::lars, any::covr, any::linprog, any::SIS
          needs: check

      - name: Cache oracle libraries
        uses: actions/cache@v4
        with:
          path: ~/.cache/R/SILM-dev
          key: silm-oracles-${{ runner.os }}-${{ hashFiles('validation/setup_legacy_libs.R') }}-r-release

      - name: Build oracle libraries (archived CRAN packages)
        run: Rscript validation/setup_legacy_libs.R

      - name: Run equivalence harness
        run: Rscript validation/run_equivalence.R --tier "$TIER" --glmnet user --cores 4 --only "${{ matrix.shard }}"

      # The scenarios above name the nodewise rule explicitly. --no-new-args
      # leaves it at its default ("ZnZ"), which must reproduce SILM 1.0.0 with
      # hdi 0.1-10 (lib-legacy-znz); run it for the shards with B-*-znz cases.
      - name: Check the default nodewise against SILM 1.0.0 with hdi 0.1-10
        if: ${{ !cancelled() && contains(fromJSON('[".", "^B-SR|^B-Step", "^B-SimCI-znz", "^B-ST-znz"]'), matrix.shard) }}
        run: |
          only='${{ matrix.shard }}'
          if [ "$only" = "." ]; then only='^B-'; fi
          Rscript validation/run_equivalence.R --tier "$TIER" --glmnet user --cores 4 --no-new-args --only "$only"

      - name: Job summary
        if: always()
        run: |
          # The reports written by this job (the committed ones are tracked).
          for f in $(git ls-files --others --exclude-standard -- 'validation/reports/equivalence-*.md' | sort); do
            cat "$f" >> "$GITHUB_STEP_SUMMARY"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: equivalence-report-${{ env.TIER }}-${{ strategy.job-index }}
          path: validation/reports/
