# Test coverage (covr); fails if the total coverage drops below 80%.
name: coverage

on:
  push:
    branches: [main]
    paths: ['R/**', 'tests/**', '.github/workflows/coverage.yml']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr
          needs: coverage
      - name: Coverage
        run: |
          cov <- covr::package_coverage(quiet = FALSE)
          tab <- covr::coverage_to_list(cov)
          total <- round(tab$totalcoverage, 2)
          lines <- c(sprintf("## Test coverage: %s%%", total), "", "| File | Coverage |", "|---|---|",
                     sprintf("| %s | %.1f%% |", names(tab$filecoverage), tab$filecoverage))
          cat(lines, sep = "\n", file = Sys.getenv("GITHUB_STEP_SUMMARY"), append = TRUE)
          print(cov)
          if (total < 80) stop("Test coverage ", total, "% is below 80%.")
        shell: Rscript {0}
